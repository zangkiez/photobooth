# ============================================================
# Photobooth Production — Raspberry Pi (arm64)
# รันบน Pi: docker compose -f docker-compose.production.pi.yml up -d
# อัปเดต: git pull && docker compose -f docker-compose.production.pi.yml up -d --build
# Config จาก env — ใส่ใน .env
# ============================================================

services:
  photobooth:
    build:
      context: .
      dockerfile: Dockerfile.production
    platform: linux/arm64
    container_name: photobooth-production
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - photobooth_data:/var/www/html/data
      - photobooth_private:/var/www/html/private
      - photobooth_var:/var/www/html/var
      - /var/run/cups/cups.sock:/var/run/cups/cups.sock
    env_file:
      - .env
    environment:
      - TZ=Asia/Bangkok
      - PHOTOBOOTH_FORCE_GENERATE_CONFIG=1
    # Pi RAM น้อย — จำกัด memory
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 192M

volumes:
  photobooth_data:
  photobooth_private:
  photobooth_var:
