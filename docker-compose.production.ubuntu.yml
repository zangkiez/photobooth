# ============================================================
# Photobooth Production — Ubuntu (amd64)
# รัน: docker compose -f docker-compose.production.ubuntu.yml up -d
# อัปเดต: git pull && docker compose -f docker-compose.production.ubuntu.yml up -d --build
#
# Config ทั้งหมดจาก env (ไม่ต้องมีไฟล์ config บน host)
# ตั้งค่าใน .env หรือ environment ด้านล่าง
# ============================================================

services:
  photobooth:
    build:
      context: .
      dockerfile: Dockerfile.production
    platform: linux/amd64
    container_name: photobooth-production
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - photobooth_data:/var/www/html/data
      - photobooth_private:/var/www/html/private
      - photobooth_var:/var/www/html/var
      - /var/run/cups/cups.sock:/var/run/cups/cups.sock
    env_file:
      - .env
    environment:
      - TZ=Asia/Bangkok
      - PHOTOBOOTH_FORCE_GENERATE_CONFIG=1
      # ตัวอย่าง (หรือใส่ใน .env): PHOTOBOOTH_WEBSERVER_URL=http://192.168.1.100
      # ตัวอย่าง (หรือใส่ใน .env): PHOTOBOOTH_PRINTER_NAME=Dai_Nippon_Printing_DP_QW410
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

volumes:
  photobooth_data:
  photobooth_private:
  photobooth_var:
