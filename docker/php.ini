; Photobooth PHP overrides (Docker dev and production)
; Collage + GIF + MP4 need higher memory and time to avoid request failure
; If you still see "128 MB exhausted", rebuild: docker compose -f docker-compose.dev.yml build --no-cache

memory_limit = 768M
upload_max_filesize = 32M
post_max_size = 40M
max_execution_time = 300
max_input_time = 300
max_file_uploads = 20

realpath_cache_size = 4096K
realpath_cache_ttl = 600
