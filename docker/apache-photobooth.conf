# Allow serving static assets including node_modules (required for Photobooth)
<Directory "/app">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
<Directory "/app/node_modules">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>
<Directory "/app/resources">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>
