# Photobooth — Apache vhost (ใช้ทั้ง dev และ production ใน Docker)
# Timeout ต้องยาวพอให้ applyEffects (collage + GIF + MP4) ประมวลผลเสร็จ

<VirtualHost *:80>
    DocumentRoot /var/www/html
    Timeout 300
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/photobooth_error.log
    CustomLog ${APACHE_LOG_DIR}/photobooth_access.log combined
</VirtualHost>
